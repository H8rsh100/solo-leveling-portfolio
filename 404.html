<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Penalty Zone — Transfer Complete</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E7%BD%B0%3C/text%3E%3C/svg%3E" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Courier New', monospace;
      background: linear-gradient(180deg, #160401 0%, #3a1206 55%, #120402 100%);
      color: #e8c9a8;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #desert { position: fixed; inset: 0; z-index: 0; }
    .dune {
      position: fixed; left: -20%; width: 140%; height: 30vh;
      border-radius: 50% 50% 0 0; z-index: 0; pointer-events: none;
    }
    .dune.d1 { bottom: -12vh; background: rgba(122, 52, 18, 0.35); animation: drift 14s ease-in-out infinite alternate; }
    .dune.d2 { bottom: -18vh; background: rgba(70, 26, 10, 0.5); animation: drift 20s ease-in-out infinite alternate-reverse; }
    @keyframes drift { from { transform: translateX(-2%); } to { transform: translateX(2%); } }
    .penalty-wrap { position: relative; z-index: 2; padding: 2rem; width: min(560px, 92vw); }
    .system-box {
      border: 1px solid rgba(255, 80, 40, 0.5);
      background: rgba(10, 2, 0, 0.82);
      box-shadow: 0 0 40px rgba(255, 60, 20, 0.25), inset 0 0 60px rgba(255, 60, 20, 0.05);
      padding: 2.5rem 2rem;
      text-align: center;
      backdrop-filter: blur(6px);
    }
    .sys-head {
      color: #ff5030; letter-spacing: 4px; font-size: 0.8rem;
      text-shadow: 0 0 15px rgba(255, 80, 48, 0.8); margin-bottom: 1rem;
      animation: blink 1.6s steps(2) infinite;
    }
    @keyframes blink { 50% { opacity: 0.55; } }
    h1 {
      font-size: clamp(2rem, 7vw, 3.2rem); letter-spacing: 8px; color: #fff;
      text-shadow: 0 0 30px rgba(255, 80, 40, 0.7); margin-bottom: 1.2rem;
    }
    .sys-body { font-size: 0.9rem; line-height: 1.9; margin-bottom: 0.5rem; }
    .dim { color: rgba(232, 201, 168, 0.5); font-size: 0.8rem; }
    .rune {
      font-family: serif; font-size: 4rem; color: rgba(255, 80, 40, 0.35);
      text-shadow: 0 0 30px rgba(255, 80, 40, 0.4); margin: 1rem 0;
    }
    .return-btn {
      display: inline-block; margin-top: 0.5rem; padding: 0.8rem 2rem;
      border: 1px solid rgba(255, 80, 40, 0.6); color: #ffb08a;
      text-decoration: none; letter-spacing: 3px; font-size: 0.8rem;
      transition: all 0.3s ease;
    }
    .return-btn:hover { background: rgba(255, 80, 40, 0.12); color: #fff; box-shadow: 0 0 20px rgba(255, 80, 40, 0.4); }
    @media (prefers-reduced-motion: reduce) { .dune, .sys-head { animation: none; } }
  </style>
</head>

<body>
  <canvas id="desert"></canvas>
  <div class="dune d1"></div>
  <div class="dune d2"></div>

  <div class="penalty-wrap">
    <div class="system-box">
      <p class="sys-head">⚠ SYSTEM WARNING</p>
      <h1>PENALTY ZONE</h1>
      <p class="sys-body">
        You failed to complete the daily quest.<br />
        Transfer to the penalty zone is complete.<br />
        <span class="dim">Survive 4 hours. The centipedes are already moving.</span>
      </p>
      <div class="rune">罰</div>
      <a class="return-btn" href="index.html">▶ Return to the Gate</a>
    </div>
  </div>

  <script>
    // Penalty Zone centipedes — segmented crawlers on canvas 2D
    (function () {
      const c = document.getElementById('desert');
      const x = c.getContext('2d');
      let W, H;
      function rs() { W = c.width = window.innerWidth; H = c.height = window.innerHeight; }
      rs();
      window.addEventListener('resize', rs);

      class Pede {
        constructor(dir) {
          this.dir = dir || (Math.random() > 0.5 ? 1 : -1);
          this.y = H * 0.7 + Math.random() * H * 0.25;
          this.x = this.dir > 0 ? -100 : W + 100;
          this.sp = 1 + Math.random() * 1.8;
          this.segs = 10 + Math.floor(Math.random() * 8);
          this.ph = Math.random() * 7;
          this.len = 14;
        }
        step() {
          this.x += this.sp * this.dir;
          this.ph += 0.15;
          if ((this.dir < 0 && this.x < -160) || (this.dir > 0 && this.x > W + 160)) {
            this.dir *= -1;
            this.y = H * 0.7 + Math.random() * H * 0.25;
          }
        }
        draw() {
          x.save();
          x.strokeStyle = 'rgba(15, 6, 3, 0.92)';
          x.lineWidth = 7;
          x.lineCap = 'round';
          x.beginPath();
          for (let i = 0; i <= this.segs; i++) {
            const sx = this.x - this.dir * i * this.len;
            const sy = this.y + Math.sin(this.ph + i * 0.7) * 6;
            if (i) x.lineTo(sx, sy); else x.moveTo(sx, sy);
          }
          x.stroke();
          // legs
          x.strokeStyle = 'rgba(255, 90, 40, 0.35)';
          x.lineWidth = 1.5;
          for (let i = 1; i < this.segs; i++) {
            const sx = this.x - this.dir * i * this.len;
            const sy = this.y + Math.sin(this.ph + i * 0.7) * 6;
            const w = Math.sin(this.ph * 2 + i) * 5;
            x.beginPath();
            x.moveTo(sx, sy); x.lineTo(sx, sy - 9 - w);
            x.moveTo(sx, sy); x.lineTo(sx, sy + 9 + w);
            x.stroke();
          }
          // glowing eyes on head
          x.fillStyle = '#ff3b1f';
          x.shadowColor = '#ff3b1f';
          x.shadowBlur = 12;
          x.beginPath();
          x.arc(this.x, this.y - 3, 2.2, 0, 7);
          x.arc(this.x, this.y + 3, 2.2, 0, 7);
          x.fill();
          x.restore();
        }
      }

      const swarm = [new Pede(1), new Pede(-1), new Pede(1)];
      const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduced) {
        swarm.forEach(p => p.draw());
      } else {
        (function loop() {
          x.clearRect(0, 0, W, H);
          swarm.forEach(p => { p.step(); p.draw(); });
          requestAnimationFrame(loop);
        })();
      }
    })();
  </script>
</body>

</html>
